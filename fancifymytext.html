<!DOCTYPE html>
<html>
	<head>
		<title>Fancify Shamcify</title>

		<!-- link to your script file here -->
		<link rel="stylesheet" type="text/css" href="fancifymytext.css">
		<script src="fancifymytext.js" defer></script>
		
	</head>

	<body>
		<h1>Fancify my Text</h1>
		

		<!-- Your UI controls go here -->
		<fieldset class="Text">
			<legend>Text</legend>
			<textarea id="Text" class="Text" rows="4" cols="30"></textarea>
		</fieldset>
		<fieldset class = "Fancify">
			<legend>Fancify</legend>
			<label class = "Big">
				<input type="button" id="Bigger" value="Bigger!"></input>
			</label>
			<label class="fancy">
				<input type="radio" id="fancy" name="style" value="FancyShmancy"> FancyShmancy
			</label>
			<label class="boring">
				<input type="radio" id="boring" name="style" value="BoringBetty"> BoringBetty
			</label>
				<label class="moo">
					<input type="button" id="Moo" value="Moo!"></input>
				</label>
		</fieldset>
	</body>
</html>
